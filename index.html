<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyForge</title>
    <script src="/boot.js"></script>
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" class="splash" data-tauri-drag-region>
      <!-- The app icon, same shape as `src-tauri/icons/source/pyforge.svg`. -->
      <svg class="splash-logo" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="8" y="8" width="84" height="84" rx="19" fill="#0E8C8C" />
        <rect x="22" y="22" width="56" height="56" rx="13" fill="#12211F" />
        <g fill="none" stroke="#EAE7E0" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M37.5 67 V 39" />
          <path d="M37.5 39 H 42 A 8.5 8.5 0 0 1 42 56 H 37.5" />
          <path d="M58.5 59 V 36.5 Q 58.5 33.5 61.5 33.5" />
          <path d="M50.5 46 H 62.5" />
        </g>
      </svg>
      <!-- The wordmark as text: the previous one was an outlined path of the old name. -->
      <span class="splash-wordmark splash-wordmark-text" role="img" aria-label="PyForge">PyForge</span>
      <div class="splash-bar" role="progressbar" aria-label="Loading"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
