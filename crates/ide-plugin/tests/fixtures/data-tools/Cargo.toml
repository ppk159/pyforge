[package]
name = "pyforge-plugin-data-tools"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyforge-plugin = { path = "../../../../../sdk/rust/pyforge-plugin" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
